language = "C"
include_guard = "CCB_H"
autogen_warning = "/* Generated by cbindgen from crates/ccb/src/ffi.rs. Do not edit; run scripts/gen-header.sh. */"
header = """/*
 * crypto-core-bridge C ABI (Rust implementation).
 *
 * Contract (docs/CONTRACT.md):
 *  - every function returns a CCB_* status and never unwinds;
 *  - only key IDs cross this boundary, never key bytes;
 *  - (ptr, len) inputs may pass NULL only when len == 0;
 *  - output buffers must not overlap inputs;
 *  - a ccb_ctx is Send + Sync: calls on one context are serialised internally.
 */"""
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
cpp_compat = true
usize_is_size_t = true
style = "type"

[export]
include = ["ccb_key_id"]
# Internal Rust constants; the C ABI exposes the CCB_-prefixed copies only.
exclude = ["KEY_LEN", "NONCE_LEN", "TAG_LEN", "MAC_LEN", "WRAP_LEN", "SEAL_OVERHEAD", "FLAG_EXPORTABLE"]

[defines]
"feature = test-hooks" = "CCB_TEST_HOOKS"
